name: 'Mock Secret Store'
description: 'Gia lap secret-store tren Windows dung PowerShell'

runs:
  using: 'composite'
  steps:
    - name: Setup Mock CLI Tool for Windows
      shell: pwsh
      run: |
        # Tao thu muc luu secret trong Temp
        $storeDir = Join-Path $env:TEMP "mock_secret_store"
        New-Item -ItemType Directory -Force -Path $storeDir | Out-Null

        # Tao thu muc bin va add vao GITHUB_PATH
        $binDir = Join-Path $env:USERPROFILE ".local\bin"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null
        "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        # Tao file PowerShell script gia lap secret-store.ps1
        $psScriptPath = Join-Path $binDir "secret-store.ps1"
        @'
        param (
            [string]$Command,
            [string]$Arg
        )

        $storeDir = Join-Path $env:TEMP "mock_secret_store"

        if ($Command -eq "store-secret") {
            $handle = "handle-$((Get-Random))"
            $filePath = Join-Path $storeDir $handle
            $Arg | Out-File -FilePath $filePath -Encoding utf8 -NoNewline
            Write-Output $handle
        }
        elseif ($Command -eq "retrieve-secret") {
            $filePath = Join-Path $storeDir $Arg
            if (Test-Path $filePath) {
                Get-Content -Path $filePath -Raw
            }
        }
        '@ | Out-File -FilePath $psScriptPath -Encoding utf8