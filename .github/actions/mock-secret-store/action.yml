name: 'Mock Secret Store'
description: 'Gia lap secret-store tren Windows'

runs:
  using: 'composite'
  steps:
    - name: Setup Mock CLI Tool for Windows
      shell: pwsh
      run: |
        $storeDir = Join-Path $env:TEMP "mock_secret_store"
        New-Item -ItemType Directory -Force -Path $storeDir | Out-Null

        $binDir = Join-Path $env:USERPROFILE ".local\bin"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null
        "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        $cmdPath = Join-Path $binDir "secret-store.cmd"
        @'
        @echo off
        set COMMAND=%1
        set ARG=%2
        set STORE_DIR=%TEMP%\mock_secret_store

        if "%COMMAND%"=="store-secret" (
            set "HANDLE=handle-%RANDOM%"
            echo %ARG% > "%STORE_DIR%\%HANDLE%"
            echo %HANDLE%
        ) else if "%COMMAND%"=="retrieve-secret" (
            type "%STORE_DIR%\%ARG%" 2>nul
        )
        '@ | Out-File -FilePath $cmdPath -Encoding ascii