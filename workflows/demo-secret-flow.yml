on: push

jobs:
  secret-generator:
    runs-on: windows-latest
    outputs:
      handle: ${{ steps.generate-secret.outputs.handle }}
    steps:
      - uses: some/secret-store@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          credentials: ${{ secrets.SECRET_STORE_CREDENTIALS }}
          instance: ${{ secrets.SECRET_STORE_INSTANCE }}

      - name: generate secret
        id: generate-secret
        shell: pwsh
        run: |
          # Sinh so ngau nhien bang PowerShell
          $GENERATED_SECRET = Get-Random

          # Che giay giá trị secret trong log GitHub Actions
          Write-Host "::add-mask::$GENERATED_SECRET"

          # Goi CLI tool gia lap va lay ket qua
          $SECRET_HANDLE = secret-store store-secret "$GENERATED_SECRET"

          # Ghi gia tri handle vao file $env:GITHUB_OUTPUT
          "handle=$SECRET_HANDLE" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  secret-consumer:
    runs-on: windows-latest
    needs: secret-generator
    steps:
      - uses: some/secret-store@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          credentials: ${{ secrets.SECRET_STORE_CREDENTIALS }}
          instance: ${{ secrets.SECRET_STORE_INSTANCE }}

      - name: use secret
        shell: pwsh
        run: |
          # Lay handle tu output cua Job truoc
          $SECRET_HANDLE = "${{ needs.secret-generator.outputs.handle }}"

          # Truy xuat secret tu store
          $RETRIEVED_SECRET = secret-store retrieve-secret "$SECRET_HANDLE"

          # Che giay secret trong log cua Job nay
          Write-Host "::add-mask::$RETRIEVED_SECRET"

          # In thong bao
          Write-Host "We retrieved our masked secret: $RETRIEVED_SECRET"